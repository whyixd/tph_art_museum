; Moon Observe build for the Gledopto GL-C-616WL. build.sh copies this file into the WLED tree.
[platformio]
default_envs = moon_eth

[env:moon_eth]
extends = env:esp32_eth
; WLED_ETH_DEFAULT only applies when cfg.json has no eth.type, so a lost config keeps the network.
build_flags = ${env:esp32_eth.build_flags} -D USERMOD_MOON_MOTOR -D WLED_ETH_DEFAULT=WLED_ETH_GLEDOPTO
