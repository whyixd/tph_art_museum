<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2328">
  <title>GL-C-616WL IO13 → XIAO SAMD21 D8 接線</title>
  <rect width="780" height="420" fill="#ffffff"/>

  <!-- Boards -->
  <rect x="20" y="40" width="200" height="250" rx="8" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
  <text x="120" y="70" text-anchor="middle" font-size="16" font-weight="bold">GL-C-616WL</text>
  <text x="120" y="90" text-anchor="middle" font-size="12" fill="#57606a">ESP32 · WLED usermod</text>
  <text x="208" y="155" text-anchor="end">IO13</text>
  <text x="208" y="265" text-anchor="end">GND</text>
  <text x="120" y="200" text-anchor="middle" font-size="12" fill="#57606a">端子排 GND / IO13</text>
  <text x="120" y="218" text-anchor="middle" font-size="12" fill="#57606a">運轉 = LOW · 停止 = 高阻抗</text>

  <rect x="560" y="40" width="200" height="250" rx="8" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
  <text x="660" y="110" text-anchor="middle" font-size="16" font-weight="bold">XIAO SAMD21</text>
  <text x="660" y="130" text-anchor="middle" font-size="12" fill="#57606a">motor_control_d8</text>
  <text x="572" y="75">3.3V</text>
  <text x="572" y="155">D8</text>
  <text x="572" y="173" font-size="12" fill="#57606a">INPUT_PULLUP</text>
  <text x="572" y="265">GND</text>

  <!-- Pins -->
  <g fill="#1f2328">
    <circle cx="220" cy="150" r="4"/>
    <circle cx="220" cy="260" r="4"/>
    <circle cx="560" cy="70" r="4"/>
    <circle cx="560" cy="150" r="4"/>
    <circle cx="560" cy="260" r="4"/>
  </g>

  <!-- Signal: IO13 → R1 → D8 -->
  <g stroke="#0969da" stroke-width="2.5" fill="none">
    <line x1="220" y1="150" x2="250" y2="150"/>
    <line x1="310" y1="150" x2="560" y2="150"/>
  </g>
  <rect x="250" y="141" width="60" height="18" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="280" y="131" text-anchor="middle" font-weight="bold">R1 1kΩ</text>
  <text x="280" y="180" text-anchor="middle" font-size="12" fill="#57606a">330Ω–2.2kΩ</text>

  <!-- Pull-up: D8 → R2 → XIAO 3.3V -->
  <g stroke="#cf222e" stroke-width="2.5" fill="none">
    <polyline points="470,150 470,135"/>
    <polyline points="470,85 470,70 560,70"/>
  </g>
  <rect x="461" y="85" width="18" height="50" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="452" y="108" text-anchor="end" font-weight="bold">R2 10kΩ</text>
  <text x="452" y="125" text-anchor="end" font-size="12" fill="#57606a">上拉，必要</text>

  <!-- Optional filter: D8 → C1 → GND -->
  <g stroke="#1f2328" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <line x1="470" y1="150" x2="470" y2="198"/>
    <line x1="470" y1="208" x2="470" y2="260"/>
  </g>
  <g stroke="#1f2328" stroke-width="2.5">
    <line x1="455" y1="198" x2="485" y2="198"/>
    <line x1="455" y1="208" x2="485" y2="208"/>
  </g>
  <text x="452" y="200" text-anchor="end" font-weight="bold">C1 100nF</text>
  <text x="452" y="217" text-anchor="end" font-size="12" fill="#57606a">選配，防雜訊</text>

  <!-- Ground -->
  <line x1="220" y1="260" x2="560" y2="260" stroke="#1f2328" stroke-width="2.5"/>
  <text x="290" y="252" text-anchor="middle" font-size="12" fill="#57606a">GND 直接接線</text>

  <!-- Junctions -->
  <circle cx="470" cy="150" r="5" fill="#1f2328"/>
  <circle cx="470" cy="260" r="5" fill="#1f2328"/>

  <!-- Placement -->
  <g stroke="#8c959f" stroke-width="1" stroke-dasharray="3 3" fill="none">
    <rect x="236" y="112" width="90" height="78" rx="6"/>
    <rect x="366" y="56" width="134" height="170" rx="6"/>
  </g>
  <text x="281" y="208" text-anchor="middle" font-size="12" fill="#57606a">靠 GL-C-616WL 端</text>
  <text x="433" y="243" text-anchor="middle" font-size="12" fill="#57606a">靠 XIAO 端</text>

  <!-- Notes -->
  <g font-size="13">
    <text x="20" y="325">• 停止：IO13 高阻抗 → R2 把 D8 拉到約 3.3V（HIGH）。運轉：IO13 拉低 → D8 約 0.37V（LOW）。</text>
    <text x="20" y="348">• R2 接 XIAO 的 3.3V，不接 GL-C-616WL 的 3.3V；ESP32 開機期間 GPIO13 帶內部下拉，R2 讓 D8 維持 HIGH。</text>
    <text x="20" y="371">• R1 限制兩端同時輸出、地電位突波與 ESD 的電流；大於 2.2kΩ 時運轉電壓會高到讀不到 LOW。</text>
    <text x="20" y="394">• GND 取 GL-C-616WL 端子排 IO13 旁的 GND，不取燈條輸出端子的 GND；只能接 0–3.3V，勿接 5V、12V、48V。</text>
  </g>
</svg>
