[artnet]
ip = "192.0.2.50"
universe = 0
# source_ip = "192.0.2.10" # Optional: bind a specific network interface.

[render]
preset = "preset.example.json"
sequence = "sequence.json"
fps = 60
rpm = 340
pixels = 156
unit_id = 1
unit_count = 9

# To output all units from one backend (up to 64; this installation has 24),
# replace ip/universe above with one [[artnet.targets]] entry per unit:
# [[artnet.targets]]
# unit_id = 1
# ip = "192.0.2.51"
# universe = 0   # first universe; a unit needing N universes uses universe..universe+N-1

# 轉燈硬體（整段與各欄位皆可省略；省略時與參考系統的 470 bytes 相同）。
# Spinner hardware; omit to keep the reference payload (156 px RGB + ch469 motor = 470 bytes).
# [hardware]
# color_order = "RGB"            # RGB / RBG / GRB / GBR / BRG / BGR
# brightness = 1.0               # 0..1, applied before quantization
# channels_per_universe = 510    # multiple of 3, <= 510 (WLED: 170 RGB pixels per universe)
#
# [motor]
# channel = 469                  # default: right after the pixels (pixels * 3 + 1); 0 = soft stop, 255 = soft start

# DMX 燈具（球燈、洗牆燈）經 Art-Net -> DMX 轉換器；整段選填。`run.py --patch-report` 印出位址表。
# DMX fixtures through Art-Net -> DMX nodes; optional. `run.py --patch-report` prints the address table.
# [[dmx.profiles]]
# name = "ball-rgbw"
# channels = ["r", "g", "b", "w"]   # fixture channel order; other names (dimmer, strobe...) need a static value
# white = "min"                      # min: W = min(R,G,B) taken out of RGB; none: W stays dark
# brightness = 1.0                   # 0..1
# static = {}                        # e.g. { dimmer = 255, strobe = 0 }
#
# [[dmx.nodes]]
# name = "ball-node"
# ip = "192.0.2.200"
# universe = 100                     # must not be a spinner IP/universe
#
# [[dmx.patch]]
# group = "ball"                     # ball / wash
# first_id = 1                       # ids first_id .. first_id+count-1 (球燈編號 1-37)
# count = 37
# profile = "ball-rgbw"
# node = "ball-node"
# address = 1                        # start address of the first fixture
# # address_step = 4                 # default: the profile's channel count (1, 5, 9, ...)

# Add the actual installation coordinates to enable Open-Meteo weather control.
# [weather]
# latitude = 25.0330
# longitude = 121.5654
# interval_minutes = 15
# cloud_step = 6
# palette = "palette.json"  # 天氣色盤；可在 /palette.html 編輯，不存在時用內建三段
#
# Optional hourly visits: each hour, after the current round ends, play one round
# with the next location's weather, then return to local weather.
# [[weather.visits]]
# name = "東京"
# latitude = 35.6762
# longitude = 139.6503
