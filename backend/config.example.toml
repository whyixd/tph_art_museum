# 美術館現場（doc/新北美_ip控箱.pdf）：Art-Net 網段 2.0.0.0/8，主機 Raspberry Pi 5。
# Museum site (doc/新北美_ip控箱.pdf): Art-Net on 2.0.0.0/8, host Raspberry Pi 5.
[artnet]
# 主機在 Art-Net 網段的 IP，Art-Net 從這個位址送出。也是安全閥：2.0.0.0/8 是公用網段，主機沒有這個 IP
# （不在現場網路、網路線沒接）時 Art-Net 暫停、不送任何封包，網頁與 API 照常；位址出現後幾秒內自動開始送。
# The host's Art-Net address; Art-Net is sent from it. It is also a safety catch: 2.0.0.0/8 is public address
# space, so without this address (not on the site network, cable unplugged) Art-Net pauses and nothing is sent
# (never through the default gateway to the internet); the page and API stay up, and sending starts within a
# few seconds once the address appears.
source_ip = "2.0.0.10"

[render]
preset = "preset.example.json"
sequence = "sequence.json"
fps = 40
rpm = 190
pixels = 129               # 每台 3 條燈條並聯（共用資料），每條 129 顆繞垂直圓周一圈
unit_count = 24
# layout = "layout.json"   # 場景座標（cm）：轉燈依 unit、球燈／洗牆燈依編號；範例見 layout.example.json（取自 spaces05.png）
                           # scene positions (cm): spinners by unit, fixtures by id; see layout.example.json

# 轉燈：unit n = 2.0.0.(200 + n)，WLED universe 0（firmware/wled/unit_settings.json）。
# 每根柱子由上往下編號（2026-11-12 現場確認）：同柱兩台中 IP 靠前的是較高那台。控箱 104 = 13 號（單獨燈桿）+ 14 號
# （球燈 17-20 那根柱子上，依由上往下的規則是最低那台，待確認）。
# Spinners: unit n = 2.0.0.(200 + n), WLED universe 0. Numbered from the top on each pole (site check 2026-11-12):
# of two spinners on a pole the higher one has the earlier IP.
[[artnet.targets]]
unit_id = 1
ip = "2.0.0.201"
universe = 0

