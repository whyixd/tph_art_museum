# 洗牆燈：25 顆 RGBW（通道 R G B W，無 dimmer／strobe），沿後牆地面往上打牆，獨立一台轉換器。
# 位址 1, 5, 9 … 97。IP 暫定 2.0.0.100（待現場確認），universe 0。
# Wall washers: 25 RGBW (R G B W, no dimmer/strobe) on the floor along the back wall, washing up the wall,
# on their own node. Addresses 1, 5, 9 ... 97. IP 2.0.0.100 is provisional (confirm on site), universe 0.
[[dmx.profiles]]
name = "wash-rgbw"
channels = ["r", "g", "b", "w"]
white = "min"
brightness = 1.0                   # 洗牆燈的亮度安全上限 / safety ceiling for the wall washers

[[dmx.nodes]]
name = "wash"
ip = "2.0.0.100"
universe = 0

[[dmx.patch]]
group = "wash"
first_id = 1
count = 25
profile = "wash-rgbw"
node = "wash"
address = 1

# 音樂：Pi 從 USB 音效卡播放，燈光跟著音訊時鐘。沒有 PortAudio（libportaudio2）時音訊停用、燈光照常。
# Music: the Pi plays it on the USB sound card and the lights follow the audio clock. Without PortAudio
# (libportaudio2) audio is disabled and the lights run as usual.
[audio]
# PortAudio 輸出裝置名稱的一部分（例如 "USB"），空字串 = 系統預設。
# Part of the PortAudio output device name (e.g. "USB"); empty = system default.
device = ""
# WAV 檔所在目錄（音檔不進 git、release 另外附上；拍點檔在 backend/tracks/）。
# Directory of the WAV files (not in git; shipped beside the release). Beat maps are in backend/tracks/.
directory = "../audio"
# 延遲補償（前端「後端」分頁可調整並儲存）。 / Latency offset, adjusted and saved on the page's backend tab.
calibration = "audio-calibration.json"

# Add the actual installation coordinates to enable Open-Meteo weather control.
